<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="1000" height="300" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Cadena del comando: motor 50 derecha</text>

  <g>
    <rect x="15" y="70" width="140" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="85" y="98" text-anchor="middle" font-weight="bold" fill="#1e3a8a">REPL</text>
    <text x="85" y="120" text-anchor="middle" font-size="12" fill="#1e3a8a">read_line()</text>
    <text x="85" y="137" text-anchor="middle" font-size="12" fill="#1e3a8a">split_line()</text>
    <text x="85" y="154" text-anchor="middle" font-size="12" fill="#1e3a8a">argc = 3</text>

    <rect x="180" y="70" width="150" height="110" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="255" y="98" text-anchor="middle" font-weight="bold" fill="#312e81">cmd_motor()</text>
    <text x="255" y="120" text-anchor="middle" font-size="12" fill="#3730a3">argv[1]="50" → 50</text>
    <text x="255" y="137" text-anchor="middle" font-size="12" fill="#3730a3">argv[2]="derecha"</text>
    <text x="255" y="154" text-anchor="middle" font-size="12" fill="#3730a3">valida con strtol</text>

    <rect x="355" y="70" width="150" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="430" y="98" text-anchor="middle" font-weight="bold" fill="#78350f">motor.c</text>
    <text x="430" y="120" text-anchor="middle" font-size="12" fill="#92400e">zona muerta 40 %</text>
    <text x="430" y="137" text-anchor="middle" font-size="12" fill="#92400e">50 % → CC = 7000</text>
    <text x="430" y="154" text-anchor="middle" font-size="12" fill="#92400e">rampa + empujón</text>

    <rect x="530" y="70" width="150" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="605" y="98" text-anchor="middle" font-weight="bold" fill="#14532d">Backend</text>
    <text x="605" y="120" text-anchor="middle" font-size="12" fill="#166534">regs: *pwm_cc = …</text>
    <text x="605" y="137" text-anchor="middle" font-size="12" fill="#166534">sdk: pwm_set_gpio_level</text>
    <text x="605" y="154" text-anchor="middle" font-size="12" fill="#166534">SIO: IN1=1 IN2=0</text>

    <rect x="705" y="70" width="130" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="770" y="98" text-anchor="middle" font-weight="bold" fill="#7f1d1d">PWM + L298N</text>
    <text x="770" y="120" text-anchor="middle" font-size="12" fill="#991b1b">GP4: 100 Hz, 70 %</text>
    <text x="770" y="137" text-anchor="middle" font-size="12" fill="#991b1b">puente H conduce</text>
    <text x="770" y="154" text-anchor="middle" font-size="12" fill="#991b1b">OUT1+ OUT2−</text>

    <rect x="860" y="70" width="125" height="110" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="922" y="98" text-anchor="middle" font-weight="bold" fill="#111827">Motor DC</text>
    <text x="922" y="120" text-anchor="middle" font-size="12" fill="#374151">gira a la derecha</text>
    <text x="922" y="137" text-anchor="middle" font-size="12" fill="#374151">a ~70 % de</text>
    <text x="922" y="154" text-anchor="middle" font-size="12" fill="#374151">su velocidad</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#a)">
    <line x1="155" y1="125" x2="178" y2="125"/>
    <line x1="330" y1="125" x2="353" y2="125"/>
    <line x1="505" y1="125" x2="528" y2="125"/>
    <line x1="680" y1="125" x2="703" y2="125"/>
    <line x1="835" y1="125" x2="858" y2="125"/>
  </g>
  <text x="500" y="225" text-anchor="middle" font-size="13" fill="#374151">comando REPL → C (argc/argv) → lógica del motor → registros PWM/SIO → dispositivo externo → resultado físico</text>
  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#6b7280">Si el sentido cambia: rampa a 0 % → pausa 500 ms → cambiar IN1/IN2 → rampa a la nueva velocidad</text>
</svg>
