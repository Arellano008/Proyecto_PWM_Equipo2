<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Arquitectura de un slice PWM (RP2040 / RP2350)</text>

  <!-- CPU / bus -->
  <rect x="20" y="60" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="95" y="86" text-anchor="middle" font-weight="bold" fill="#1e3a8a">CPU</text>
  <text x="95" y="105" text-anchor="middle" font-size="12" fill="#1e3a8a">M0+ / M33</text>
  <rect x="200" y="60" width="760" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="580" y="85" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Bus AHB-Lite → APB  ·  registros memory-mapped</text>
  <text x="580" y="105" text-anchor="middle" font-size="12" fill="#1e3a8a">PWM_BASE = 0x40050000 (RP2040) · 0x400A8000 (RP2350)   CSR · DIV · CTR · CC · TOP · EN · INTR</text>
  <line x1="170" y1="90" x2="200" y2="90" stroke="#1d4ed8" stroke-width="3"/>

  <!-- slice box -->
  <rect x="20" y="150" width="800" height="300" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="34" y="172" font-weight="bold" fill="#374151">Slice n  (8 en RP2040, 12 en RP2350)</text>

  <!-- clk -->
  <text x="40" y="250" font-weight="bold" fill="#111827">clk_sys</text>
  <text x="40" y="268" font-size="12" fill="#4b5563">125 / 150 MHz</text>
  <line x1="110" y1="245" x2="150" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="150" y="210" width="140" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="220" y="238" text-anchor="middle" font-weight="bold" fill="#78350f">Divisor DIV</text>
  <text x="220" y="258" text-anchor="middle" font-size="12" fill="#92400e">INT.FRAC (8.4)</text>
  <line x1="290" y1="245" x2="340" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="340" y="200" width="160" height="90" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="420" y="228" text-anchor="middle" font-weight="bold" fill="#312e81">Contador CTR</text>
  <text x="420" y="247" text-anchor="middle" font-size="12" fill="#3730a3">16 bits, 0 → TOP</text>
  <text x="420" y="265" text-anchor="middle" font-size="12" fill="#3730a3">PH_CORRECT: 0→TOP→0</text>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#3730a3">wrap → IRQ / DREQ</text>
  <rect x="360" y="320" width="120" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="420" y="345" text-anchor="middle" fill="#4c1d95">TOP</text>
  <line x1="420" y1="320" x2="420" y2="292" stroke="#6d28d9" stroke-width="2" marker-end="url(#a)"/>

  <!-- comparators -->
  <line x1="500" y1="225" x2="560" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="265" x2="560" y2="325" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="560" y="185" width="130" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="625" y="210" text-anchor="middle" font-weight="bold" fill="#14532d">CTR &lt; CC.A ?</text>
  <text x="625" y="229" text-anchor="middle" font-size="12" fill="#166534">comparador A</text>
  <rect x="560" y="295" width="130" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="625" y="320" text-anchor="middle" font-weight="bold" fill="#14532d">CTR &lt; CC.B ?</text>
  <text x="625" y="339" text-anchor="middle" font-size="12" fill="#166534">comparador B</text>

  <rect x="715" y="185" width="90" height="60" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="760" y="212" text-anchor="middle" font-weight="bold" fill="#831843">A_INV</text>
  <text x="760" y="230" text-anchor="middle" font-size="11" fill="#9d174d">polaridad</text>
  <rect x="715" y="295" width="90" height="60" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="760" y="322" text-anchor="middle" font-weight="bold" fill="#831843">B_INV</text>
  <text x="760" y="340" text-anchor="middle" font-size="11" fill="#9d174d">pol. / entrada</text>
  <line x1="690" y1="215" x2="715" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="690" y1="325" x2="715" y2="325" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- DIVMODE feedback from B -->
  <polyline points="760,355 760,410 220,410 220,282" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="490" y="430" text-anchor="middle" font-size="12" fill="#92400e">DIVMODE 1–3: el pin B como entrada controla el conteo (medir duty / frecuencia)</text>

  <!-- outputs -->
  <line x1="805" y1="215" x2="850" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="805" y1="325" x2="850" y2="325" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="850" y="175" width="130" height="200" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="915" y="205" text-anchor="middle" font-weight="bold" fill="#111827">IO_BANK0</text>
  <text x="915" y="224" text-anchor="middle" font-size="12" fill="#374151">FUNCSEL = 4</text>
  <text x="915" y="250" text-anchor="middle" font-weight="bold" fill="#111827">PADS_BANK0</text>
  <text x="915" y="269" text-anchor="middle" font-size="12" fill="#374151">OD=0 IE=1</text>
  <text x="915" y="286" text-anchor="middle" font-size="12" fill="#374151">ISO=0 (RP2350)</text>
  <text x="915" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">GP4 → ENA</text>
  <text x="915" y="340" text-anchor="middle" font-size="12" fill="#374151">GPIO par = A</text>
  <text x="915" y="356" text-anchor="middle" font-size="12" fill="#374151">GPIO impar = B</text>

  <text x="500" y="485" text-anchor="middle" font-size="14" fill="#111827">f = clk_sys / (DIV · (TOP+1) · [2 si PH_CORRECT])     ·     duty = CC / (TOP+1)</text>
  <text x="500" y="507" text-anchor="middle" font-size="12" fill="#4b5563">CC y TOP tienen doble búfer: los cambios se aplican al terminar el periodo</text>
</svg>
