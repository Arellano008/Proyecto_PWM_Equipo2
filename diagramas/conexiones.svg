<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Diagrama de conexiones – PWM + L298N + Motor DC (Equipo 2)</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#4b5563">Mismo cableado para Raspberry Pi Pico (RP2040) y Pico 2 W (RP2350): el pinout físico es idéntico</text>

  <!-- PC -->
  <rect x="30" y="230" width="110" height="70" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="85" y="260" text-anchor="middle" font-weight="bold" fill="#111827">PC</text>
  <text x="85" y="280" text-anchor="middle" font-size="12" fill="#374151">Terminal serie</text>
  <line x1="140" y1="265" x2="200" y2="265" stroke="#374151" stroke-width="3"/>
  <text x="170" y="255" text-anchor="middle" font-size="11" fill="#374151">USB</text>

  <!-- Pico -->
  <rect x="200" y="110" width="200" height="330" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <text x="300" y="140" text-anchor="middle" font-weight="bold" font-size="16" fill="#064e3b">Raspberry Pi Pico</text>
  <text x="300" y="158" text-anchor="middle" font-size="12" fill="#065f46">RP2040 / Pico 2 W RP2350</text>
  <g font-size="13" fill="#064e3b">
    <text x="390" y="205" text-anchor="end">GP2 (pin 4) ●</text>
    <text x="390" y="245" text-anchor="end">GP3 (pin 5) ●</text>
    <text x="390" y="285" text-anchor="end">GP4 (pin 6) ●</text>
    <text x="390" y="325" text-anchor="end">GND (pin 8) ●</text>
  </g>
  <text x="215" y="205" font-size="11" fill="#065f46">SIO</text>
  <text x="215" y="245" font-size="11" fill="#065f46">SIO</text>
  <text x="215" y="285" font-size="11" font-weight="bold" fill="#b45309">PWM slice 2 A</text>
  <text x="300" y="420" text-anchor="middle" font-size="11" fill="#065f46">Alimentada por USB</text>

  <!-- wires Pico -> L298N -->
  <line x1="400" y1="200" x2="560" y2="200" stroke="#16a34a" stroke-width="3"/>
  <line x1="400" y1="240" x2="560" y2="240" stroke="#2563eb" stroke-width="3"/>
  <line x1="400" y1="280" x2="560" y2="280" stroke="#ea580c" stroke-width="3"/>
  <line x1="400" y1="320" x2="560" y2="320" stroke="#111827" stroke-width="3"/>
  <text x="480" y="193" text-anchor="middle" font-size="12" fill="#16a34a">IN1 – dirección</text>
  <text x="480" y="233" text-anchor="middle" font-size="12" fill="#2563eb">IN2 – dirección</text>
  <text x="480" y="273" text-anchor="middle" font-size="12" fill="#ea580c">ENA – velocidad (100 Hz)</text>
  <text x="480" y="313" text-anchor="middle" font-size="12" fill="#111827">GND común</text>

  <!-- L298N -->
  <rect x="560" y="110" width="210" height="330" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="665" y="140" text-anchor="middle" font-weight="bold" font-size="16" fill="#7f1d1d">L298N</text>
  <text x="665" y="158" text-anchor="middle" font-size="12" fill="#991b1b">Puente H doble</text>
  <g font-size="13" fill="#7f1d1d">
    <text x="572" y="205">● IN1</text>
    <text x="572" y="245">● IN2</text>
    <text x="572" y="285">● ENA</text>
    <text x="572" y="325">● GND</text>
    <text x="572" y="375">● VS (12V)</text>
    <text x="572" y="410">● +5V</text>
  </g>
  <text x="640" y="285" font-size="11" fill="#b91c1c">(quitar jumper ENA)</text>
  <text x="665" y="432" text-anchor="middle" font-size="11" fill="#b91c1c">quitar jumper del regulador 5V</text>
  <g font-size="13" fill="#7f1d1d">
    <text x="760" y="225" text-anchor="end">OUT1 ●</text>
    <text x="760" y="265" text-anchor="end">OUT2 ●</text>
  </g>

  <!-- motor -->
  <line x1="770" y1="220" x2="860" y2="220" stroke="#6b7280" stroke-width="3"/>
  <line x1="770" y1="260" x2="860" y2="260" stroke="#6b7280" stroke-width="3"/>
  <circle cx="900" cy="240" r="42" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <text x="900" y="245" text-anchor="middle" font-weight="bold" font-size="20" fill="#111827">M</text>
  <text x="900" y="305" text-anchor="middle" font-size="13" fill="#374151">Motor DC</text>

  <!-- power -->
  <rect x="560" y="470" width="210" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="665" y="495" text-anchor="middle" font-weight="bold" fill="#78350f">Fuente externa 5 V</text>
  <text x="665" y="514" text-anchor="middle" font-size="12" fill="#92400e">HW-131 (o batería) – máx ~700 mA</text>
  <polyline points="780,500 830,500 830,370 770,370" fill="none" stroke="#dc2626" stroke-width="3"/>
  <polyline points="830,405 770,405" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="840" y="440" font-size="12" fill="#dc2626">+5 V → VS y +5V</text>
  <polyline points="560,500 520,500 520,320" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="510" y="470" text-anchor="end" font-size="12" fill="#111827">GND fuente = GND L298N = GND Pico</text>
</svg>
